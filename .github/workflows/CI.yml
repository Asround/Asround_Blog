name: Fuwari-yCENzh CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Content, tests and Astro check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check content, comment config, tests and Astro
        run: pnpm check:local
        env:
          ENABLE_CONTENT_SYNC: false

      - name: Install Chromium for comment regression tests
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Check comment lifecycle and failure recovery in Chromium
        timeout-minutes: 5
        env:
          ENABLE_CONTENT_SYNC: false
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          node node_modules/astro/astro.js dev --host 127.0.0.1 --port 4321 > "$RUNNER_TEMP/comments-dev.log" 2>&1 &
          comments_server_pid=$!
          trap 'kill "$comments_server_pid" 2>/dev/null || true' EXIT
          comments_server_ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:4321/src/components/comment/Giscus.svelte > /dev/null; then
              comments_server_ready=true
              break
            fi
            if ! kill -0 "$comments_server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$comments_server_ready" != true ]; then
            cat "$RUNNER_TEMP/comments-dev.log"
            exit 1
          fi
          if ! pnpm test:comments:browser http://127.0.0.1:4321; then
            cat "$RUNNER_TEMP/comments-dev.log"
            exit 1
          fi

  build:
    name: Astro Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Astro Build
        run: pnpm astro build
        env:
          ENABLE_CONTENT_SYNC: false
