name: Fuwari-yCENzh CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Content, tests and Astro check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check content, comment config, tests and Astro
        run: pnpm check:local
        env:
          ENABLE_CONTENT_SYNC: false

      - name: Install Chromium for browser regression tests
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Check comments, reading, search, sharing, chapters, images and print
        timeout-minutes: 15
        env:
          ENABLE_CONTENT_SYNC: false
          PLAYWRIGHT_CHANNEL: chromium
        run: node scripts/run-browser-checks.mjs

  build:
    name: Astro Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Astro Build
        run: pnpm astro build
        env:
          ENABLE_CONTENT_SYNC: false
